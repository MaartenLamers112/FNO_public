{% extends "base.html" %}
{% block title %}Wachtwoord wijzigen | Foto Nummeraar Online{% endblock %}
{% block content %}
<section class="admin-form-page account-password-page" aria-labelledby="password-title">
    <form class="admin-form" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <h1 id="password-title">Wachtwoord wijzigen</h1>
        <label for="current-password">Huidig wachtwoord</label>
        <input id="current-password" name="current_password" type="password" autocomplete="current-password" required>
        <label for="new-password">Nieuw wachtwoord</label>
        <input id="new-password" name="new_password" type="password" minlength="4" autocomplete="new-password" required>
        <label for="new-password-confirmation">Herhaal nieuw wachtwoord</label>
        <input id="new-password-confirmation" name="new_password_confirmation" type="password" minlength="4" autocomplete="new-password" required>
        <div class="admin-form-actions">
            <button class="primary-button" type="submit">Wachtwoord wijzigen</button>
        </div>
    </form>
</section>
{% endblock %}
