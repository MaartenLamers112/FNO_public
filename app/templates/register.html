{% extends "base.html" %}

{% block title %}Registreren | Foto Nummeraar Online{% endblock %}

{% block content %}
<section class="login-panel" aria-labelledby="register-title">
    <h1 id="register-title">Registreren</h1>
    <p class="login-introduction">
        Maak een account aan om namen, beschrijvingen en opmerkingen bij foto's
        te kunnen aanvullen.
    </p>

    <form method="post" class="login-form">
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label for="username">Gebruikersnaam</label>
        <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
            autofocus
        >

        <label for="email">E-mailadres</label>
        <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
        >

        <label for="password">Wachtwoord</label>
        <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <label for="password_confirmation">Herhaal wachtwoord</label>
        <input
            id="password_confirmation"
            name="password_confirmation"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <button class="primary-button" type="submit">
            Account aanmaken
        </button>
    </form>

    <p>
        Al een account?
        <a href="{{ url_for('auth.login') }}">Aanmelden</a>
    </p>
</section>
{% endblock %}
