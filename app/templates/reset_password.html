{% extends "base.html" %}
{% block title %}Nieuw wachtwoord | Foto Nummeraar Online{% endblock %}
{% block content %}
<section class="login-panel" aria-labelledby="reset-password-title">
    <h1 id="reset-password-title">Nieuw wachtwoord instellen</h1>
    <p class="login-introduction">Kies een nieuw wachtwoord van minimaal 8 tekens.</p>
    <form method="post" class="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="password">Nieuw wachtwoord</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required autofocus>
        <label for="password-confirmation">Herhaal nieuw wachtwoord</label>
        <input id="password-confirmation" name="password_confirmation" type="password" autocomplete="new-password" minlength="8" required>
        <button class="primary-button" type="submit">Wachtwoord opslaan</button>
    </form>
</section>
{% endblock %}
